name: build

on:
  push:
    branches: [master]
    tags:     ["v*"]
  pull_request:
    branches: [master]
  # Manual trigger from Gitea UI: Actions tab -> "build" -> "Run workflow".
  workflow_dispatch:

# When master gets pushed and then a tag created at the same commit, Gitea
# fires both events and the workflow runs twice on the same SHA -- the build
# is identical, so cancel the in-flight one when a newer event for the same
# commit arrives.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    outputs:
      version: ${{ steps.ver.outputs.version }}
      title:   ${{ steps.ver.outputs.title }}
      body:    ${{ steps.ver.outputs.body }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- native build (x86) --------------------------------------------
      # Building x86 (Win32) rather than x64 because SAPI's voice registry
      # is bitness-segregated under HKLM\SOFTWARE\WOW6432Node\Microsoft\
      # Speech\Voices for 32-bit consumers. Some installed voices on prod
      # had expired trials whose 64-bit engines pop a modal "trial expired"
      # dialog -- which on a service running as NetworkService (no desktop)
      # blocks ISpVoice::Speak indefinitely. The 32-bit voice registry has
      # working unencumbered voices, so build 32-bit.
      #
      # muxaudio comes from the upstream v0.3 release as a self-contained
      # bundled DLL (all codec libs statically linked into muxaudio.dll).
      # sapicli.vcxproj's pre-build target runs deploy\fetch-muxaudio.ps1
      # automatically, so no explicit stage step is needed here.
      - name: msbuild Release|Win32
        run: |
          REM Use the amd64_x86 cross-compiler (64-bit cl.exe targeting x86)
          REM rather than the 32-bit native cl.exe. The runner's workspace
          REM lives under C:\Windows\System32\config\systemprofile\.cache\
          REM act\...\hostexecutor (because actrunner runs as LocalSystem,
          REM whose profile is under System32). 32-bit cl.exe gets WoW64
          REM file-system-redirected from \System32\ to \SysWOW64\, where
          REM the source files don't exist -- that's the C1083 we hit.
          REM PreferredToolArchitecture=x64 keeps cl.exe out of WoW64.
          REM (Output is still x86; only the compiler host changes.)
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
          msbuild sapicli.sln -p:Configuration=Release -p:Platform=Win32 -p:PreferredToolArchitecture=x64 -nologo -m -v:minimal

      - name: smoke test sapicli --list
        run: Win32\Release\sapicli.exe --list

      # ---- derive version + release metadata ---------------------------
      # Version: tag (v0.8 -> 0.8, v1.2.3 -> 1.2.3) or 0.0.0 for non-tag
      # builds. The regex accepts 1-4 numeric parts so v0.8 works as
      # well as v0.8.1.
      #
      # Title / body: read from the tag's annotation message. The first
      # line of `git tag -m '...'` becomes the release title; everything
      # after is the body. Falls back to the tag name if the tag is
      # lightweight (no annotation) or this isn't a tag build.
      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+(?:\.\d+){0,3})') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $title = ''
          $body  = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $title = (git tag -l --format='%(contents:subject)' $tag | Out-String).Trim()
            $body  = (git tag -l --format='%(contents:body)'    $tag | Out-String).Trim()
            if (-not $title) { $title = $tag }
          }

          $eof = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "title=$title"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - name: zip sapicli.exe + muxaudio DLLs
        shell: pwsh
        run: |
          $zip = "$pwd\sapicli-${{ steps.ver.outputs.version }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          # sapicli.vcxproj's post-build already sprayed all of
          # third_party\muxaudio\Win32\bin\*.dll next to the exe, so the
          # release zip is just "Win32\Release\sapicli.exe + every .dll".
          $files = @('Win32\Release\sapicli.exe') + (Get-ChildItem 'Win32\Release\*.dll' | Select-Object -ExpandProperty FullName)
          Compress-Archive -Path $files -DestinationPath $zip
          Write-Host "Built $zip ($((Get-Item $zip).Length) bytes)"

      - name: upload zip artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapicli-${{ steps.ver.outputs.version }}-${{ github.sha }}.zip
          path: sapicli-${{ steps.ver.outputs.version }}.zip
          retention-days: 30

  # ---- Release --------------------------------------------------------
  # Tag-pushes only. Creates (or finds) a Gitea release for the tag, then
  # uploads the build job's zip as a release asset so the artifact is
  # downloadable from the public release page (not just from the run's
  # private Actions artifacts).
  release:
    needs: build
    runs-on: [self-hosted, windows, x64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: download zip artifact
        uses: actions/download-artifact@v3
        with:
          name: sapicli-${{ needs.build.outputs.version }}-${{ github.sha }}.zip

      - name: create release + upload asset
        shell: pwsh
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          TAG:         ${{ github.ref_name }}
          VERSION:     ${{ needs.build.outputs.version }}
          TITLE:       ${{ needs.build.outputs.title }}
          BODY:        ${{ needs.build.outputs.body }}
          SERVER:      ${{ github.server_url }}
          SHA:         ${{ github.sha }}
        run: |
          if (-not $env:GITEA_TOKEN) { throw "GITHUB_TOKEN unavailable" }

          $base    = "$env:SERVER/api/v1/repos/$env:REPO"
          $headers = @{ Authorization = "token $env:GITEA_TOKEN" }

          $title = if ($env:TITLE) { $env:TITLE } else { $env:TAG }
          $body  = if ($env:BODY)  { $env:BODY  } else { "Automated build of sapicli $env:VERSION from commit $env:SHA." }

          $payload = @{
            tag_name   = $env:TAG
            name       = $title
            body       = $body
            draft      = $false
            prerelease = $false
          } | ConvertTo-Json

          # Re-run safety: if a release for this tag already exists, PATCH
          # its name + body so a re-tag with a new annotation actually
          # updates the visible title. Otherwise create.
          try {
            $rel = Invoke-RestMethod -Uri "$base/releases/tags/$env:TAG" -Headers $headers -ErrorAction Stop
            Invoke-RestMethod -Uri "$base/releases/$($rel.id)" -Method PATCH -Headers $headers `
                              -ContentType 'application/json' -Body $payload | Out-Null
            Write-Host "Updated existing release $env:TAG (id=$($rel.id), title='$title')"
          } catch {
            $rel = Invoke-RestMethod -Uri "$base/releases" -Method POST -Headers $headers `
                                     -ContentType 'application/json' -Body $payload
            Write-Host "Created release $env:TAG (id=$($rel.id), title='$title')"
          }

          $assetPath = ".\sapicli-$env:VERSION.zip"
          $assetName = "sapicli-$env:VERSION.zip"
          if (-not (Test-Path $assetPath)) {
            Get-ChildItem | Out-String | Write-Host
            throw "expected $assetPath after download-artifact, but it's not here"
          }
          $existing = $rel.assets | Where-Object { $_.name -eq $assetName }
          if ($existing) {
            Write-Host "Replacing existing asset $assetName (id=$($existing.id))"
            Invoke-RestMethod -Uri "$base/releases/$($rel.id)/assets/$($existing.id)" `
                              -Method DELETE -Headers $headers | Out-Null
          }
          $assetUrl = "$base/releases/$($rel.id)/assets?name=" + [Uri]::EscapeDataString($assetName)
          Invoke-RestMethod -Uri $assetUrl -Method POST -Headers $headers `
                            -Form @{ attachment = Get-Item $assetPath } | Out-Null
          Write-Host "Uploaded $assetName to release $env:TAG"
