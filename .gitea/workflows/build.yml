name: build

on:
  push:
    branches: [master]
    tags:     ["v*"]
  pull_request:
    branches: [master]
  # Manual trigger from Gitea UI: Actions tab -> "build" -> "Run workflow".
  # Useful for redeploying without pushing a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    # Expose the resolved version to downstream jobs (deploy needs it
    # to construct the artifact name + zip filename).
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- vcpkg install + native build (x86) ---------------------------
      # Building x86 (Win32) rather than x64 because SAPI's voice registry
      # is bitness-segregated under HKLM\SOFTWARE\WOW6432Node\Microsoft\
      # Speech\Voices for 32-bit consumers. Some installed voices on prod
      # had expired trials whose 64-bit engines pop a modal "trial expired"
      # dialog -- which on a service running as NetworkService (no desktop)
      # blocks ISpVoice::Speak indefinitely. The 32-bit voice registry
      # has working unencumbered voices, so build 32-bit.
      #
      # vcpkg.targets auto-install: skipped, see prior commit. We call
      # vcpkg.exe directly with the matching x86-windows-static triplet
      # and build msbuild with VcpkgEnableManifest=false.
      - name: vcpkg install (manifest mode, x86)
        run: |
          C:\vcpkg\vcpkg.exe install --triplet=x86-windows-static --x-manifest-root=. --x-install-root=.\vcpkg_installed\x86-windows-static

      - name: msbuild Release|Win32
        run: |
          REM Use the amd64_x86 cross-compiler (64-bit cl.exe targeting x86)
          REM rather than the 32-bit native cl.exe. The runner's workspace
          REM lives under C:\Windows\System32\config\systemprofile\.cache\
          REM act\...\hostexecutor (because actrunner runs as LocalSystem,
          REM whose profile is under System32). 32-bit cl.exe gets WoW64
          REM file-system-redirected from \System32\ to \SysWOW64\, where
          REM the source files don't exist -- that's the C1083 we hit.
          REM PreferredToolArchitecture=x64 keeps cl.exe out of WoW64.
          REM (Output is still x86; only the compiler host changes.)
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
          msbuild sapicli.sln -p:Configuration=Release -p:Platform=Win32 -p:PreferredToolArchitecture=x64 -p:VcpkgEnableManifest=false -nologo -m -v:minimal

      - name: smoke test sapicli --list
        run: Win32\Release\sapicli.exe --list

      # ---- WASM build (muxaudio.js + muxaudio.wasm) ----------------------
      # cmake/ninja/python are on PATH (installed by runner-setup.ps1 via
      # winget). emsdk is at C:\emsdk. Build into muxaudio/build-wasm/, then
      # copy artifacts into www/ so the staging step picks them up.
      - name: build muxaudio WASM
        shell: pwsh
        run: |
          $build = "$pwd\muxaudio\build-wasm"
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && emcmake.bat cmake `"$pwd\muxaudio`" -B `"$build`" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCODEC_VORBIS=ON -DCODEC_OPUS=ON -DCODEC_MP3=ON -DCODEC_MP3_DECODE=ON -DCODEC_MP3_ENCODE=OFF -DCMAKE_BUILD_TYPE=Release"
          if ($LASTEXITCODE -ne 0) { throw "emcmake failed" }
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && cmake --build `"$build`" --target muxaudio"
          if ($LASTEXITCODE -ne 0) { throw "wasm build failed" }
          Copy-Item "$build\muxaudio.js","$build\muxaudio.wasm" www/ -Force

      # ---- assemble dist/ + zip it ---------------------------------------
      # Version comes from the tag (v0.8 -> 0.8, v1.2.3 -> 1.2.3) on tag
      # pushes; 0.0.0 for branch / PR builds. The regex accepts 1-4 numeric
      # parts so `v0.8` works as well as `v0.8.1`.
      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+(?:\.\d+){0,3})') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: stage + zip dist/
        shell: pwsh
        run: |
          $dist = "$pwd\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item Win32\Release\sapicli.exe $dist\
          Copy-Item Win32\Release\sapisrv.exe $dist\
          Copy-Item -Recurse www $dist\www
          $zip = "$pwd\sapisrv-${{ steps.ver.outputs.version }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip
          Write-Host "Built $zip ($((Get-Item $zip).Length) bytes)"

      - name: upload zip artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapisrv-${{ steps.ver.outputs.version }}-${{ github.sha }}.zip
          path: sapisrv-${{ steps.ver.outputs.version }}.zip
          retention-days: 30

  # ---- Deploy ----------------------------------------------------------
  # Auto-runs on tag pushes (v*) for production releases, or manually via
  # the workflow_dispatch trigger for ad-hoc redeploys. Skipped on
  # branch/PR builds. Requires three repo secrets:
  #
  #   DEPLOY_HOST      target machine IP or DNS name
  #   DEPLOY_USER      local admin on target, format "<host>\<user>"
  #                    e.g. "192.168.1.92\Administrator"
  #   DEPLOY_PASSWORD  password for that account
  #
  # One-time setup on the runner machine (we deploy FROM the runner, so
  # WinRM client must trust the target):
  #   Set-Item WSMan:\localhost\Client\TrustedHosts -Value '*' -Force
  # (or pin to specific IPs / a subnet pattern).
  #
  # And on the target machine (we deploy TO the prod VM, so WinRM server
  # must accept us):
  #   Enable-PSRemoting -SkipNetworkProfileCheck -Force
  #   New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' \
  #     -Name LocalAccountTokenFilterPolicy -PropertyType DWord -Value 1 -Force
  #   Restart-Service WinRM
  deploy:
    needs: build
    runs-on: [self-hosted, windows, x64]
    # Auto-deploy on tag pushes (production), branch master (iteration),
    # or manual workflow_dispatch. Tighten to tag-only once production is
    # stable.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' }}
    steps:
      - name: checkout (just for Deploy-Remote.ps1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: download zip artifact
        uses: actions/download-artifact@v3
        with:
          name: sapisrv-${{ needs.build.outputs.version }}-${{ github.sha }}.zip

      - name: deploy via PSRemoting
        shell: pwsh
        env:
          DEPLOY_HOST:     ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if (-not $env:DEPLOY_HOST)     { throw "DEPLOY_HOST secret not set" }
          if (-not $env:DEPLOY_USER)     { throw "DEPLOY_USER secret not set" }
          if (-not $env:DEPLOY_PASSWORD) { throw "DEPLOY_PASSWORD secret not set" }

          $sec  = ConvertTo-SecureString $env:DEPLOY_PASSWORD -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:DEPLOY_USER, $sec)
          $zip  = ".\sapisrv-${{ needs.build.outputs.version }}.zip"
          if (-not (Test-Path $zip)) {
            Get-ChildItem | Out-String | Write-Host
            throw "expected $zip after download-artifact, but it's not here"
          }
          .\deploy\Deploy-Remote.ps1 -ComputerName $env:DEPLOY_HOST -Credential $cred -ZipPath $zip

  # ---- Release --------------------------------------------------------
  # Tag-pushes only. Creates (or finds) a Gitea release for the tag, then
  # uploads the build job's zip as a release asset so the artifact is
  # downloadable from the public release page (not just from the run's
  # private Actions artifacts).
  release:
    needs: build
    runs-on: [self-hosted, windows, x64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: download zip artifact
        uses: actions/download-artifact@v3
        with:
          name: sapisrv-${{ needs.build.outputs.version }}-${{ github.sha }}.zip

      - name: create release + upload zip
        shell: pwsh
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          TAG:         ${{ github.ref_name }}
          VERSION:     ${{ needs.build.outputs.version }}
          SERVER:      ${{ github.server_url }}
          SHA:         ${{ github.sha }}
        run: |
          if (-not $env:GITEA_TOKEN) { throw "GITHUB_TOKEN unavailable" }

          $base    = "$env:SERVER/api/v1/repos/$env:REPO"
          $headers = @{ Authorization = "token $env:GITEA_TOKEN" }

          # Re-run safety: if a release for this tag already exists, reuse it.
          # Otherwise create a fresh one with the tag name as the title.
          try {
            $rel = Invoke-RestMethod -Uri "$base/releases/tags/$env:TAG" -Headers $headers -ErrorAction Stop
            Write-Host "Reusing existing release for $env:TAG (id=$($rel.id))"
          } catch {
            $body = @{
              tag_name   = $env:TAG
              name       = $env:TAG
              body       = "Automated build of sapisrv $env:VERSION from commit $env:SHA."
              draft      = $false
              prerelease = $false
            } | ConvertTo-Json
            $rel = Invoke-RestMethod -Uri "$base/releases" -Method POST -Headers $headers `
                                     -ContentType 'application/json' -Body $body
            Write-Host "Created release $env:TAG (id=$($rel.id))"
          }

          $zip     = ".\sapisrv-$env:VERSION.zip"
          $zipName = "sapisrv-$env:VERSION.zip"
          if (-not (Test-Path $zip)) {
            Get-ChildItem | Out-String | Write-Host
            throw "expected $zip after download-artifact, but it's not here"
          }

          # If an asset with this name already exists on the release (re-run),
          # delete it first so the new upload doesn't get auto-renamed.
          $existing = $rel.assets | Where-Object { $_.name -eq $zipName }
          if ($existing) {
            Write-Host "Replacing existing asset $zipName (id=$($existing.id))"
            Invoke-RestMethod -Uri "$base/releases/$($rel.id)/assets/$($existing.id)" `
                              -Method DELETE -Headers $headers | Out-Null
          }

          # Gitea wants multipart/form-data, field name "attachment".
          # PowerShell 7's -Form on Invoke-RestMethod handles that for us.
          $assetUrl = "$base/releases/$($rel.id)/assets?name=" + [Uri]::EscapeDataString($zipName)
          Invoke-RestMethod -Uri $assetUrl -Method POST -Headers $headers `
                            -Form @{ attachment = Get-Item $zip } | Out-Null
          Write-Host "Uploaded $zipName to release $env:TAG"
