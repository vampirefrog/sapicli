name: build

on:
  push:
    branches: [master, redesign]
    tags:     ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: cmd

    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- vcpkg install + native build ---------------------------------
      # We can't rely on msbuild's vcpkg.targets auto-install on this
      # runner: it picks up the vcpkg bundled with VS BuildTools, which
      # (a) ignores VCPKG_ROOT, and (b) fails to bootstrap on a fresh
      # LocalSystem profile (a 7zip 25.01 self-extract bug). Workaround:
      # call C:\vcpkg\vcpkg.exe install ourselves, then build with
      # VcpkgEnableManifest=false so msbuild doesn't try to re-install.
      # The vcxprojs explicitly list the vcpkg include/lib dirs and lib
      # filenames so they don't need the auto-resolution either.
      - name: vcpkg install (manifest mode)
        run: |
          REM --x-install-root mirrors the double-triplet layout msbuild's
          REM vcpkg integration produces locally (vcpkg_installed/x64-windows-
          REM static/x64-windows-static/include/...), so the include + lib
          REM paths in the vcxprojs match in both environments.
          C:\vcpkg\vcpkg.exe install --triplet=x64-windows-static --x-manifest-root=. --x-install-root=.\vcpkg_installed\x64-windows-static

      - name: msbuild Release|x64
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          msbuild sapicli.sln -p:Configuration=Release -p:Platform=x64 -p:VcpkgEnableManifest=false -nologo -m -v:minimal

      - name: smoke test sapicli --list
        run: x64\Release\sapicli.exe --list

      # ---- WASM build (muxaudio.js + muxaudio.wasm) ----------------------
      # cmake/ninja/python are on PATH (installed by runner-setup.ps1 via
      # winget). emsdk is at C:\emsdk. Build into muxaudio/build-wasm/, then
      # copy artifacts into www/ so the staging step picks them up.
      - name: build muxaudio WASM
        shell: pwsh
        run: |
          $build = "$pwd\muxaudio\build-wasm"
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && emcmake.bat cmake `"$pwd\muxaudio`" -B `"$build`" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCODEC_VORBIS=ON -DCODEC_OPUS=ON -DCODEC_MP3=ON -DCODEC_MP3_DECODE=ON -DCODEC_MP3_ENCODE=OFF -DCMAKE_BUILD_TYPE=Release"
          if ($LASTEXITCODE -ne 0) { throw "emcmake failed" }
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && cmake --build `"$build`" --target muxaudio"
          if ($LASTEXITCODE -ne 0) { throw "wasm build failed" }
          Copy-Item "$build\muxaudio.js","$build\muxaudio.wasm" www/ -Force

      # ---- assemble dist/ + zip it ---------------------------------------
      # The deploy story is "copy this zip to the target machine, unzip,
      # run sapisrv.exe install". No MSI; nothing fancy. The version comes
      # from the tag (v0.1.2 -> 0.1.2) on tag pushes, otherwise 0.0.0 for
      # branch / PR builds.
      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+\.\d+\.\d+)') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: stage + zip dist/
        shell: pwsh
        run: |
          $dist = "$pwd\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item x64\Release\sapicli.exe $dist\
          Copy-Item x64\Release\sapisrv.exe $dist\
          Copy-Item -Recurse www $dist\www
          $zip = "$pwd\sapisrv-${{ steps.ver.outputs.version }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip
          Write-Host "Built $zip ($((Get-Item $zip).Length) bytes)"

      - name: upload zip artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapisrv-${{ steps.ver.outputs.version }}-${{ github.sha }}.zip
          path: sapisrv-${{ steps.ver.outputs.version }}.zip
          retention-days: 30

  # Deploy job will land in a follow-up commit. Plan:
  #   - download the zip artifact
  #   - PSRemoting to the prod VM
  #   - stop sapisrv service, copy zip, unzip, start service
  #   - on tag pushes only.
