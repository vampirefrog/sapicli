name: build

on:
  push:
    branches: [master]
    tags:     ["v*"]
  pull_request:
    branches: [master]
  # Manual trigger from Gitea UI: Actions tab -> "build" -> "Run workflow".
  # Useful for redeploying without pushing a new commit.
  workflow_dispatch:

# When master gets pushed and then a tag created at the same commit,
# Gitea fires both events and the workflow runs twice on the same SHA --
# the build is identical, so cancel the in-flight one when a newer event
# for the same commit arrives. The tag-push run wins (because it's the
# later event), which gives us deploy + release in one go instead of
# two duplicate builds.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    # Expose the resolved version + tag-annotation-derived title/body to
    # downstream jobs. deploy uses the version for the zip filename;
    # release uses title + body for the Gitea release metadata.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      title:   ${{ steps.ver.outputs.title }}
      body:    ${{ steps.ver.outputs.body }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- vcpkg install + native build (x86) ---------------------------
      # Building x86 (Win32) rather than x64 because SAPI's voice registry
      # is bitness-segregated under HKLM\SOFTWARE\WOW6432Node\Microsoft\
      # Speech\Voices for 32-bit consumers. Some installed voices on prod
      # had expired trials whose 64-bit engines pop a modal "trial expired"
      # dialog -- which on a service running as NetworkService (no desktop)
      # blocks ISpVoice::Speak indefinitely. The 32-bit voice registry
      # has working unencumbered voices, so build 32-bit.
      #
      # vcpkg.targets auto-install: skipped, see prior commit. We call
      # vcpkg.exe directly with the matching x86-windows-static triplet
      # and build msbuild with VcpkgEnableManifest=false.
      - name: vcpkg install (manifest mode, x86)
        run: |
          C:\vcpkg\vcpkg.exe install --triplet=x86-windows-static --x-manifest-root=. --x-install-root=.\vcpkg_installed\x86-windows-static

      - name: msbuild Release|Win32
        run: |
          REM Use the amd64_x86 cross-compiler (64-bit cl.exe targeting x86)
          REM rather than the 32-bit native cl.exe. The runner's workspace
          REM lives under C:\Windows\System32\config\systemprofile\.cache\
          REM act\...\hostexecutor (because actrunner runs as LocalSystem,
          REM whose profile is under System32). 32-bit cl.exe gets WoW64
          REM file-system-redirected from \System32\ to \SysWOW64\, where
          REM the source files don't exist -- that's the C1083 we hit.
          REM PreferredToolArchitecture=x64 keeps cl.exe out of WoW64.
          REM (Output is still x86; only the compiler host changes.)
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
          msbuild sapicli.sln -p:Configuration=Release -p:Platform=Win32 -p:PreferredToolArchitecture=x64 -p:VcpkgEnableManifest=false -nologo -m -v:minimal

      - name: smoke test sapicli --list
        run: Win32\Release\sapicli.exe --list

      # ---- WASM build (muxaudio.js + muxaudio.wasm) ----------------------
      # cmake/ninja/python are on PATH (installed by runner-setup.ps1 via
      # winget). emsdk is at C:\emsdk. Build into muxaudio/build-wasm/, then
      # copy artifacts into www/ so the staging step picks them up.
      - name: build muxaudio WASM
        shell: pwsh
        run: |
          $build = "$pwd\muxaudio\build-wasm"
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && emcmake.bat cmake `"$pwd\muxaudio`" -B `"$build`" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCODEC_VORBIS=ON -DCODEC_OPUS=ON -DCODEC_MP3=ON -DCODEC_MP3_DECODE=ON -DCODEC_MP3_ENCODE=OFF -DCMAKE_BUILD_TYPE=Release"
          if ($LASTEXITCODE -ne 0) { throw "emcmake failed" }
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && cmake --build `"$build`" --target muxaudio"
          if ($LASTEXITCODE -ne 0) { throw "wasm build failed" }
          Copy-Item "$build\muxaudio.js","$build\muxaudio.wasm" www/ -Force

      # ---- derive version + release metadata ---------------------------
      # Version: tag (v0.8 -> 0.8, v1.2.3 -> 1.2.3) or 0.0.0 for non-tag
      # builds. The regex accepts 1-4 numeric parts so v0.8 works as
      # well as v0.8.1.
      #
      # Title / body: read from the tag's annotation message. The first
      # line of `git tag -m '...'` becomes the release title; everything
      # after is the body. Falls back to the tag name if the tag is
      # lightweight (no annotation) or this isn't a tag build.
      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+(?:\.\d+){0,3})') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Tag-message extraction. Only meaningful on tag builds; for
          # branch/PR/dispatch the title/body outputs are empty and the
          # release job (which is the only consumer) doesn't run anyway.
          $title = ''
          $body  = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $title = (git tag -l --format='%(contents:subject)' $tag | Out-String).Trim()
            $body  = (git tag -l --format='%(contents:body)'    $tag | Out-String).Trim()
            if (-not $title) { $title = $tag }   # lightweight tag fallback
          }
          # GITHUB_OUTPUT escapes for multi-line values: use a heredoc.
          "title<<__EOF__`n$title`n__EOF__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "body<<__EOF__`n$body`n__EOF__"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: stage + zip dist/
        shell: pwsh
        run: |
          $dist = "$pwd\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item Win32\Release\sapicli.exe $dist\
          Copy-Item Win32\Release\sapisrv.exe $dist\
          Copy-Item -Recurse www $dist\www
          Copy-Item deploy\gen-keys.ps1 $dist\
          $zip = "$pwd\sapisrv-${{ steps.ver.outputs.version }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip
          Write-Host "Built $zip ($((Get-Item $zip).Length) bytes)"

      # Compile the NSIS installer. NSIS at "C:\Program Files (x86)\NSIS\
      # makensis.exe" is 32-bit; the runner workspace is under
      # C:\Windows\System32\config\systemprofile\.cache\act\... (because
      # actrunner runs as LocalSystem). 32-bit processes hit WoW64 file-
      # system redirection on \System32\ -> \SysWOW64\, where the workspace
      # doesn't exist; makensis would say "Can't open script". Same kind
      # of bug as the cl.exe one we worked around with the amd64_x86 cross
      # compiler -- but NSIS has no 64-bit binary to switch to.
      #
      # Workaround: stage the .nsi + dist/ into a fresh non-System32 dir,
      # build there, copy the .exe back to the workspace, clean up.
      - name: build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $exe     = "sapisrv-setup-$version.exe"
          if (Test-Path $exe) { Remove-Item $exe }
          # NSIS VIProductVersion is strict 4-part numeric. Pad as needed.
          $parts   = @($version -split '\.')
          while ($parts.Length -lt 4) { $parts += '0' }
          $vi      = ($parts[0..3] -join '.')

          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (-not (Test-Path $makensis)) {
              throw "makensis.exe not on PATH and not at '$makensis'. Install via 'winget install NSIS.NSIS --scope machine'."
            }
          }

          $stage = "C:\actrunner-nsis\$($env:GITHUB_SHA)"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Recurse "$pwd\dist"            "$stage\dist"
          Copy-Item          "$pwd\deploy\sapisrv.nsi" "$stage\sapisrv.nsi"

          $stagedExe = "$stage\$exe"
          & $makensis /V2 "/DVERSION=$version" "/DVIVERSION=$vi" "/DDISTDIR=$stage\dist" "/DOUTFILE=$stagedExe" "$stage\sapisrv.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path $stagedExe)) { throw "expected $stagedExe after makensis, but it's not here" }

          Move-Item $stagedExe "$pwd\$exe"
          Remove-Item $stage -Recurse -Force
          Write-Host "Built $exe ($((Get-Item "$pwd\$exe").Length) bytes)"

      - name: upload zip artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapisrv-${{ steps.ver.outputs.version }}-${{ github.sha }}.zip
          path: sapisrv-${{ steps.ver.outputs.version }}.zip
          retention-days: 30

      - name: upload installer artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapisrv-setup-${{ steps.ver.outputs.version }}-${{ github.sha }}.exe
          path: sapisrv-setup-${{ steps.ver.outputs.version }}.exe
          retention-days: 30

  # ---- Deploy ----------------------------------------------------------
  # Manual-only. Triggered by clicking "Run workflow" on the Gitea
  # Actions UI, or by POSTing to the workflow_dispatch endpoint:
  #   curl -X POST -H "Authorization: token <gitea-token>" \
  #     <gitea-url>/api/v1/repos/<owner>/<repo>/actions/workflows/build.yml/dispatches \
  #     -d '{"ref": "master"}'
  #
  # Skipped on every other event (push to master, tag pushes, PRs, etc.)
  # so production stays put unless somebody intentionally rolls forward.
  # Requires three repo secrets:
  #
  #   DEPLOY_HOST      target machine IP or DNS name
  #   DEPLOY_USER      local admin on target, format "<host>\<user>"
  #                    e.g. "192.168.1.92\Administrator"
  #   DEPLOY_PASSWORD  password for that account
  #
  # One-time setup on the runner machine (we deploy FROM the runner, so
  # WinRM client must trust the target):
  #   Set-Item WSMan:\localhost\Client\TrustedHosts -Value '*' -Force
  # (or pin to specific IPs / a subnet pattern).
  #
  # And on the target machine (we deploy TO the prod VM, so WinRM server
  # must accept us):
  #   Enable-PSRemoting -SkipNetworkProfileCheck -Force
  #   New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' \
  #     -Name LocalAccountTokenFilterPolicy -PropertyType DWord -Value 1 -Force
  #   Restart-Service WinRM
  deploy:
    needs: build
    runs-on: [self-hosted, windows, x64]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: checkout (just for Deploy-Remote.ps1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: download zip artifact
        uses: actions/download-artifact@v3
        with:
          name: sapisrv-${{ needs.build.outputs.version }}-${{ github.sha }}.zip

      - name: deploy via PSRemoting
        shell: pwsh
        env:
          DEPLOY_HOST:     ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if (-not $env:DEPLOY_HOST)     { throw "DEPLOY_HOST secret not set" }
          if (-not $env:DEPLOY_USER)     { throw "DEPLOY_USER secret not set" }
          if (-not $env:DEPLOY_PASSWORD) { throw "DEPLOY_PASSWORD secret not set" }

          $sec  = ConvertTo-SecureString $env:DEPLOY_PASSWORD -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:DEPLOY_USER, $sec)
          $zip  = ".\sapisrv-${{ needs.build.outputs.version }}.zip"
          if (-not (Test-Path $zip)) {
            Get-ChildItem | Out-String | Write-Host
            throw "expected $zip after download-artifact, but it's not here"
          }
          .\deploy\Deploy-Remote.ps1 -ComputerName $env:DEPLOY_HOST -Credential $cred -ZipPath $zip

  # ---- Release --------------------------------------------------------
  # Tag-pushes only. Creates (or finds) a Gitea release for the tag, then
  # uploads the build job's zip as a release asset so the artifact is
  # downloadable from the public release page (not just from the run's
  # private Actions artifacts).
  release:
    needs: build
    runs-on: [self-hosted, windows, x64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: download zip artifact
        uses: actions/download-artifact@v3
        with:
          name: sapisrv-${{ needs.build.outputs.version }}-${{ github.sha }}.zip

      - name: download installer artifact
        uses: actions/download-artifact@v3
        with:
          name: sapisrv-setup-${{ needs.build.outputs.version }}-${{ github.sha }}.exe

      - name: create release + upload assets
        shell: pwsh
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          TAG:         ${{ github.ref_name }}
          VERSION:     ${{ needs.build.outputs.version }}
          TITLE:       ${{ needs.build.outputs.title }}
          BODY:        ${{ needs.build.outputs.body }}
          SERVER:      ${{ github.server_url }}
          SHA:         ${{ github.sha }}
        run: |
          if (-not $env:GITEA_TOKEN) { throw "GITHUB_TOKEN unavailable" }

          $base    = "$env:SERVER/api/v1/repos/$env:REPO"
          $headers = @{ Authorization = "token $env:GITEA_TOKEN" }

          # Title comes from the tag annotation's first line; body from
          # the rest. Defaults so we never POST empty strings to Gitea.
          $title = if ($env:TITLE) { $env:TITLE } else { $env:TAG }
          $body  = if ($env:BODY)  { $env:BODY  } else { "Automated build of sapisrv $env:VERSION from commit $env:SHA." }

          $payload = @{
            tag_name   = $env:TAG
            name       = $title
            body       = $body
            draft      = $false
            prerelease = $false
          } | ConvertTo-Json

          # Re-run safety: if a release for this tag already exists,
          # PATCH its name + body so a re-tag with a new annotation
          # actually updates the visible title. Otherwise create.
          try {
            $rel = Invoke-RestMethod -Uri "$base/releases/tags/$env:TAG" -Headers $headers -ErrorAction Stop
            Invoke-RestMethod -Uri "$base/releases/$($rel.id)" -Method PATCH -Headers $headers `
                              -ContentType 'application/json' -Body $payload | Out-Null
            Write-Host "Updated existing release $env:TAG (id=$($rel.id), title='$title')"
          } catch {
            $rel = Invoke-RestMethod -Uri "$base/releases" -Method POST -Headers $headers `
                                     -ContentType 'application/json' -Body $payload
            Write-Host "Created release $env:TAG (id=$($rel.id), title='$title')"
          }

          # Upload assets. Two artifacts -- the raw zip + the NSIS .exe
          # installer. Both get attached to the release. Re-run safe:
          # any existing same-name assets are deleted first so Gitea
          # doesn't auto-rename the new upload.
          $assets = @(
            @{ Path = ".\sapisrv-$env:VERSION.zip";       Name = "sapisrv-$env:VERSION.zip" }
            @{ Path = ".\sapisrv-setup-$env:VERSION.exe"; Name = "sapisrv-setup-$env:VERSION.exe" }
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset.Path)) {
              Get-ChildItem | Out-String | Write-Host
              throw "expected $($asset.Path) after download-artifact, but it's not here"
            }
            $existing = $rel.assets | Where-Object { $_.name -eq $asset.Name }
            if ($existing) {
              Write-Host "Replacing existing asset $($asset.Name) (id=$($existing.id))"
              Invoke-RestMethod -Uri "$base/releases/$($rel.id)/assets/$($existing.id)" `
                                -Method DELETE -Headers $headers | Out-Null
            }
            # Gitea wants multipart/form-data with field name "attachment".
            # PowerShell 7's -Form on Invoke-RestMethod handles the encoding.
            $assetUrl = "$base/releases/$($rel.id)/assets?name=" + [Uri]::EscapeDataString($asset.Name)
            Invoke-RestMethod -Uri $assetUrl -Method POST -Headers $headers `
                              -Form @{ attachment = Get-Item $asset.Path } | Out-Null
            Write-Host "Uploaded $($asset.Name) to release $env:TAG"
          }
