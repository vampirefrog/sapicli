name: build

on:
  push:
    branches: [master, redesign]
    tags:     ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: cmd

    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- vcpkg install + native build ---------------------------------
      # We can't rely on msbuild's vcpkg.targets auto-install on this
      # runner: it picks up the vcpkg bundled with VS BuildTools, which
      # (a) ignores VCPKG_ROOT, and (b) fails to bootstrap on a fresh
      # LocalSystem profile (a 7zip 25.01 self-extract bug). Workaround:
      # call C:\vcpkg\vcpkg.exe install ourselves, then build with
      # VcpkgEnableManifest=false so msbuild doesn't try to re-install.
      # The vcxprojs explicitly list the vcpkg include/lib dirs and lib
      # filenames so they don't need the auto-resolution either.
      - name: vcpkg install (manifest mode)
        run: |
          REM --x-install-root mirrors the double-triplet layout msbuild's
          REM vcpkg integration produces locally (vcpkg_installed/x64-windows-
          REM static/x64-windows-static/include/...), so the include + lib
          REM paths in the vcxprojs match in both environments.
          C:\vcpkg\vcpkg.exe install --triplet=x64-windows-static --x-manifest-root=. --x-install-root=.\vcpkg_installed\x64-windows-static

      - name: msbuild Release|x64
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          msbuild sapicli.sln -p:Configuration=Release -p:Platform=x64 -p:VcpkgEnableManifest=false -nologo -m -v:minimal

      - name: smoke test sapicli --list
        run: x64\Release\sapicli.exe --list

      # ---- WASM build (muxaudio.js + muxaudio.wasm) ----------------------
      # cmake/ninja/python are on PATH (installed by runner-setup.ps1 via
      # winget). emsdk is at C:\emsdk. Build into muxaudio/build-wasm/, then
      # copy artifacts into www/ so the staging step picks them up.
      - name: build muxaudio WASM
        shell: pwsh
        run: |
          $build = "$pwd\muxaudio\build-wasm"
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && emcmake.bat cmake `"$pwd\muxaudio`" -B `"$build`" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCODEC_VORBIS=ON -DCODEC_OPUS=ON -DCODEC_MP3=ON -DCODEC_MP3_DECODE=ON -DCODEC_MP3_ENCODE=OFF -DCMAKE_BUILD_TYPE=Release"
          if ($LASTEXITCODE -ne 0) { throw "emcmake failed" }
          & cmd /c "C:\emsdk\emsdk_env.bat >nul 2>nul && cmake --build `"$build`" --target muxaudio"
          if ($LASTEXITCODE -ne 0) { throw "wasm build failed" }
          Copy-Item "$build\muxaudio.js","$build\muxaudio.wasm" www/ -Force

      # ---- assemble dist/ (binaries, web, and the keys.default.json the
      #      MSI bundles for first-run installs) -----------------------------
      - name: stage dist/
        shell: pwsh
        run: |
          $dist = "$pwd\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item x64\Release\sapicli.exe $dist\
          Copy-Item x64\Release\sapisrv.exe $dist\
          Copy-Item -Recurse www $dist\www
          Copy-Item deploy\gen-keys.ps1 $dist\
          Copy-Item deploy\License.rtf $dist\

      # ---- MSI build (WiX v5 via dotnet tool) ----------------------------
      # Install wix inside the workflow rather than depending on runner-
      # setup.ps1: that script installs wix as a dotnet global tool under
      # whichever account ran it (lenovo), but actrunner runs as
      # LocalSystem and won't see it. The workflow steps run as the
      # service account too, so installing here gives wix.exe a stable
      # home at $USERPROFILE\.dotnet\tools (LocalSystem profile in CI,
      # whoever's running it locally otherwise).
      - name: install wix dotnet tool (idempotent)
        shell: pwsh
        run: |
          $tools = "$env:USERPROFILE\.dotnet\tools"
          if (-not (Test-Path "$tools\wix.exe")) {
            dotnet tool install --global wix --version "5.*"
            if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed" }
          }
          # Make wix.exe visible to subsequent steps in this job.
          $tools | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: derive msi version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+\.\d+\.\d+)') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: build msi
        shell: pwsh
        run: |
          # WixToolset.UI.wixext   -> WixUI_Minimal dialog set
          # WixToolset.Util.wixext -> WixShellExec custom action ("Open in browser")
          # Pin both to 5.x; the unversioned latest is 7.x which is WiX-v7 only.
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build deploy\sapisrv.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d "DistDir=$pwd\dist" `
            -d "Version=${{ steps.ver.outputs.version }}" `
            -arch x64 `
            -o "$pwd\dist\sapisrv-setup.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - name: upload dist artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapicli-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: upload msi artifact
        uses: actions/upload-artifact@v3
        with:
          name: sapisrv-setup-${{ steps.ver.outputs.version }}-${{ github.sha }}.msi
          path: dist/sapisrv-setup.msi
          retention-days: 30

  # The deploy job will land in a follow-up commit alongside Step 3
  # (Install-Service.ps1 / Deploy-Remote.ps1). Once those exist, this stub
  # becomes a real job that downloads the artifact and runs Deploy-Remote
  # against the prod VM via PSRemoting on tag pushes only.
