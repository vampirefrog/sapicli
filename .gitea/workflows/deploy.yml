name: deploy

# Manual-only. Triggered from the Gitea Actions UI ("Run workflow"), or via
# the API:
#   curl -X POST -H "Authorization: token <gitea-token>" \
#     <gitea-url>/api/v1/repos/<owner>/<repo>/actions/workflows/deploy.yml/dispatches \
#     -d '{"ref": "master", "inputs": {"target_host": "10.0.0.42"}}'
#
# ---- One-time setup ---------------------------------------------------
#
# On each target machine (Windows 10 / 11 or Server 2019+, both ship
# OpenSSH):
#
#   Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
#   Start-Service sshd
#   Set-Service   sshd -StartupType Automatic
#   New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH Server (sshd)' `
#     -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
#
#   # Public-key file location depends on whether DEPLOY_USER is admin or not:
#   #   * ADMIN account   -> %ProgramData%\ssh\administrators_authorized_keys
#   #     (single shared file for all admin users, restrictive ACL required)
#   #   * NON-ADMIN acct  -> %USERPROFILE%\.ssh\authorized_keys
#   # Paste the *public* half of the deploy key into one of those.
#
#   # If you used administrators_authorized_keys, tighten the ACL sshd insists on:
#   icacls "$env:ProgramData\ssh\administrators_authorized_keys" /inheritance:r
#   icacls "$env:ProgramData\ssh\administrators_authorized_keys" /grant "Administrators:F" "SYSTEM:F"
#
# The Gitea runner needs OpenSSH client on PATH (Windows 10 / 11 have it
# by default). Nothing else.
#
# In the Gitea repo -> Settings -> Actions -> Secrets:
#
#   DEPLOY_USER     "<local user>" or "<DOMAIN\user>". Needs local admin
#                   on the target so it can write to %ProgramFiles% and
#                   update the system PATH.
#   DEPLOY_SSH_KEY  full contents of the *private* key (starts with
#                   "-----BEGIN OPENSSH PRIVATE KEY-----" and ends with
#                   "-----END OPENSSH PRIVATE KEY-----"). Generate with:
#                     ssh-keygen -t ed25519 -f deploy_key -N ""
#                   then paste deploy_key into DEPLOY_SSH_KEY and
#                   deploy_key.pub into the target's authorized_keys.

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Target machine hostname or IP'
        required: true
        type: string
      arch:
        description: 'Architecture to deploy'
        required: true
        default: x86
        type: choice
        options: [x86, x64]
      release_tag:
        description: 'Release tag (leave blank for latest)'
        required: false
        type: string
        default: ''
      install_dir:
        description: 'Install directory on the target'
        required: false
        type: string
        default: 'C:\Program Files\sapicli'
      add_to_path:
        description: 'Add the install directory to the target system PATH'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      # ---- Fetch the release zip from GitHub -----------------------------
      # Anonymous unauthenticated request; releases are public.
      - name: Download release zip
        id: fetch
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if (-not $tag) {
            $tag = (Invoke-RestMethod https://api.github.com/repos/vampirefrog/sapicli/releases/latest -UseBasicParsing).tag_name
            Write-Host "Latest release: $tag"
          }
          $version = if ($tag -match '^v(.+)$') { $matches[1] } else { $tag }
          $zip = "sapicli-$version-${{ inputs.arch }}.zip"
          $url = "https://github.com/vampirefrog/sapicli/releases/download/$tag/$zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $size = (Get-Item $zip).Length
          Write-Host "Downloaded $zip ($size bytes)"
          if ($size -lt 100000) { throw "$zip is suspiciously small ($size bytes); aborting." }
          "zip=$zip"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---- Push to target via OpenSSH ----------------------------------
      # 1. Materialize the private key from the secret into RUNNER_TEMP;
      #    lock down the ACL so sshd's "key permissions too open" check
      #    accepts it.
      # 2. scp the zip to the target's %TEMP%.
      # 3. ssh a self-contained PowerShell install script to the target
      #    via -EncodedCommand (avoids all shell / cmd escaping headaches).
      #    The script stops any running sapicli/sapilex, expands the zip
      #    into install_dir, optionally updates the system PATH, then
      #    smoke-tests `sapicli --list`.
      # 4. Always delete the key file, even on failure.
      - name: Deploy via ssh + scp
        shell: pwsh
        env:
          DEPLOY_HOST:    ${{ inputs.target_host }}
          DEPLOY_USER:    ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          INSTALL_DIR:    ${{ inputs.install_dir }}
          ADD_TO_PATH:    ${{ inputs.add_to_path }}
          ZIP:            ${{ steps.fetch.outputs.zip }}
          VERSION:        ${{ steps.fetch.outputs.version }}
        run: |
          if (-not $env:DEPLOY_USER)    { throw 'DEPLOY_USER secret not set' }
          if (-not $env:DEPLOY_SSH_KEY) { throw 'DEPLOY_SSH_KEY secret not set' }

          # Materialize the key. .NET Set-Content default trailing-newline
          # behaviour breaks some key formats, so use -NoNewline. Restrict
          # ACL to the current user so ssh doesn't refuse to use the file.
          $keyFile = Join-Path ($env:RUNNER_TEMP ?? $env:TEMP) "deploy_key"
          $env:DEPLOY_SSH_KEY | Set-Content -Path $keyFile -NoNewline -Encoding ascii
          icacls $keyFile /inheritance:r | Out-Null
          icacls $keyFile /grant "$($env:USERNAME):F" | Out-Null

          # Common ssh/scp options: disable interactive prompts, don't
          # persist the target's host key (fresh runner has no known_hosts).
          $sshOpts = @(
            '-i', $keyFile,
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'UserKnownHostsFile=NUL',
            '-o', 'BatchMode=yes'
          )

          try {
            $remoteZip = "C:/Windows/Temp/$env:ZIP"
            $target    = "$env:DEPLOY_USER@$env:DEPLOY_HOST"

            Write-Host "scp $env:ZIP -> ${target}:$remoteZip"
            & scp @sshOpts $env:ZIP "${target}:$remoteZip"
            if ($LASTEXITCODE -ne 0) { throw "scp failed with exit $LASTEXITCODE" }

            # Install script -- parameters flow in via -f substitution so the
            # here-string body itself doesn't have to interpolate anything.
            # (No collisions with regex {N,} placeholders here.)
            $installScript = @'
$ErrorActionPreference = 'Stop'
$ZipPath    = '{0}'
$InstallDir = '{1}'
$Version    = '{2}'
$AddToPath  = '{3}' -eq 'true'

Get-Process sapicli, sapilex -ErrorAction SilentlyContinue |
    Stop-Process -Force -ErrorAction SilentlyContinue

if (-not (Test-Path $InstallDir)) {
    New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
}
Expand-Archive -Path $ZipPath -DestinationPath $InstallDir -Force
Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue

$exe = Join-Path $InstallDir 'sapicli.exe'
if (-not (Test-Path $exe)) { throw "sapicli.exe not found at $exe after extract" }

if ($AddToPath) {
    $path  = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    $parts = @($path -split ';' | Where-Object { $_ })
    if ($parts -notcontains $InstallDir) {
        $newPath = (@($InstallDir) + $parts) -join ';'
        [Environment]::SetEnvironmentVariable('Path', $newPath, 'Machine')
        Write-Host "Added $InstallDir to system PATH"
    } else {
        Write-Host "$InstallDir already on system PATH"
    }
}

$out = & $exe --list 2>&1
if ($LASTEXITCODE -ne 0) { throw "$exe --list failed (exit $LASTEXITCODE): $out" }
Write-Host "sapicli $Version installed OK at $InstallDir"
'@ -f $remoteZip, $env:INSTALL_DIR, $env:VERSION, $env:ADD_TO_PATH

            # powershell.exe (Windows PowerShell 5) is present on every
            # target since Windows 7; no need to require pwsh 7 on the
            # far side. -EncodedCommand expects UTF-16 LE + base64.
            $b64 = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($installScript))

            Write-Host "ssh $target powershell -EncodedCommand ..."
            & ssh @sshOpts $target 'powershell' '-NoProfile' '-EncodedCommand' $b64
            if ($LASTEXITCODE -ne 0) { throw "remote install failed with exit $LASTEXITCODE" }
          } finally {
            Remove-Item -Path $keyFile -Force -ErrorAction SilentlyContinue
          }
