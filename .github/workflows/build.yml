name: build

on:
  push:
    branches: [master]
    tags:     ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One push + tag arriving at the same SHA (typical `git push --follow-tags`)
# fires the workflow twice. Cancel the older run; the tag run is the one we
# want to keep because it also triggers the release job.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          # Win32 (x86): SAPI's voice registry under HKLM\SOFTWARE\WOW6432Node\
          # ...\Speech\Voices is what most desktop installs of unencumbered TTS
          # voices live in, so this is the primary target.
          - { name: x86, platform: Win32, vcvars: amd64_x86 }
          # x64: same source, different toolchain.
          - { name: x64, platform: x64,   vcvars: amd64 }
    # Pin to windows-2022 (VS 2022 Enterprise, includes ATL by default).
    # windows-latest is rolling forward to a VS 18 preview whose C++ workload
    # ships without ATL, so atlbase.h isn't findable there.
    runs-on: windows-2022

    steps:
      - name: checkout (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release job needs tag annotations
          submodules: recursive   # extern/muxaudio (built by the pre-build step)

      # vcvarsall.bat wrapper: sets INCLUDE / LIB / PATH for the target arch
      # and puts msbuild + cl on PATH for subsequent steps. Doing this via a
      # manual `call "...\vcvarsall.bat"` is fragile on hosted runners where
      # the VS install location changes across image versions.
      - name: setup MSVC (${{ matrix.arch.vcvars }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch.vcvars }}

      # muxaudio is built from the extern/muxaudio submodule via vcpkg (see the
      # msbuild step). Cache vcpkg's binary archives so the codec deps
      # (ogg/vorbis/opus/flac/mpg123/mp3lame/fdk-aac) are compiled once and
      # reused across runs instead of rebuilt from source every push. Keyed on
      # the manifest + baseline; falls back to the newest per-arch cache.
      - name: cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.arch.name }}-${{ hashFiles('extern/muxaudio/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.arch.name }}-

      # ---- version derivation -------------------------------------------
      # Tag `vX(.Y(.Z(.W)))` -> X.Y.Z.W (up to 4 parts). Non-tag builds get
      # 0.0.0 so filenames stay stable.
      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+(?:\.\d+){0,3})') { $matches[1] } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---- build -----------------------------------------------------------
      # muxaudio is built from the pinned extern/muxaudio submodule. The
      # vcxproj pre-build target runs deploy\build-muxaudio.ps1 -Platform
      # $(Platform), which CMake-builds it (via vcpkg for the codec deps) and
      # stages the right (x86|x64) lib + DLLs automatically.
      - name: msbuild Release|${{ matrix.arch.platform }}
        shell: cmd
        run: msbuild sapicli.sln -p:Configuration=Release -p:Platform=${{ matrix.arch.platform }} -nologo -m -v:minimal

      # SAPI-less runners still return exit 0 (empty JSON array) so this
      # smoke test is really just proving the exe loads muxaudio.dll and
      # links cleanly.
      - name: smoke test sapicli --list
        run: ${{ matrix.arch.platform }}\Release\sapicli.exe --list

      - name: smoke test sapilex list
        run: ${{ matrix.arch.platform }}\Release\sapilex.exe list

      - name: zip sapicli.exe + sapilex.exe + muxaudio DLLs
        shell: pwsh
        run: |
          $name = "sapicli-${{ steps.ver.outputs.version }}-${{ matrix.arch.name }}"
          $zip  = "$pwd\$name.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          # sapicli.vcxproj's post-build already sprayed all the codec DLLs
          # next to sapicli.exe. Ship both exes, the DLLs, and the sample
          # PLS file (feed it to `sapilex add` to register the sample
          # pronunciations).
          $files = @(
            "${{ matrix.arch.platform }}\Release\sapicli.exe",
            "${{ matrix.arch.platform }}\Release\sapilex.exe",
            "lexemes.example.pls"
          ) + (Get-ChildItem "${{ matrix.arch.platform }}\Release\*.dll" | Select-Object -ExpandProperty FullName)
          Compress-Archive -Path $files -DestinationPath $zip
          Write-Host "Built $zip ($((Get-Item $zip).Length) bytes)"

      - name: upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: sapicli-${{ steps.ver.outputs.version }}-${{ matrix.arch.name }}
          path: sapicli-${{ steps.ver.outputs.version }}-${{ matrix.arch.name }}.zip
          retention-days: 30

  # ---- Release --------------------------------------------------------
  # Tag-pushes only. Fetches every arch's zip from the build job and attaches
  # them all to a single GitHub release named after the tag.
  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for gh release create/upload
    steps:
      - name: checkout (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true   # flatten arch-specific folders into dist/

      - name: derive version
        id: ver
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v([0-9]+(\.[0-9]+){0,3}) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: create release + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${{ steps.ver.outputs.version }}"

          # Tag annotation drives the release title + body. Lightweight tags
          # (no annotation) fall back to the tag name and a generic body.
          title=$(git tag -l --format='%(contents:subject)' "$tag" | head -n1)
          body=$(git tag -l --format='%(contents:body)' "$tag")
          [ -n "$title" ] || title="$tag"
          [ -n "$body"  ] || body="Automated build of sapicli $version from commit $GITHUB_SHA."

          # Anything after the numeric part (v1.2.3-alpha, v1.2.3-rc1, ...)
          # marks the release as pre-release.
          prerelease=""
          if [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){0,3}[-.]. ]]; then
            prerelease="--prerelease"
          fi

          # Re-run safe: create only if missing, then --clobber assets so a
          # retagged / re-run tag always ends up with the latest binaries.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" $prerelease --title "$title" --notes "$body"
          fi

          gh release upload "$tag" \
            "dist/sapicli-${version}-x86.zip" \
            "dist/sapicli-${version}-x64.zip" \
            --clobber
